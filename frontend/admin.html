<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · NEODATA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root { --cyan:#00e5ff; --violet:#6c00ff; }
    body {
      margin:0; font-family: Arial, sans-serif; background:#060608; color:#fff;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .btn { background: linear-gradient(135deg, var(--cyan), var(--violet)); color:#000; border:none; padding:10px 14px; border-radius:12px; text-decoration:none; font-weight:700; }
    .card { background: rgba(255, 255, 255, 0.05); border:1px solid rgba(255,255,255,0.08); border-radius:18px; padding:16px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
    .stat { padding:14px; border-radius:14px; background: rgba(0,0,0,0.25); }
    .stat strong { display:block; font-size:1.3rem; margin-top:6px; }
    form { display:grid; gap:10px; margin-top:10px; }
    input, button { padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.08); color:#fff; }
    button { cursor:pointer; font-weight:700; }
    .btn-small { padding:6px 10px; font-size:0.85rem; margin-right:6px; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { padding:10px; border-bottom:1px solid rgba(255,255,255,0.08); text-align:left; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <h2 style="margin:0;">Panel de administración</h2>
      <a class="btn" href="/">Volver a la tienda</a>
    </div>

    <div class="grid">
      <div class="stat"><div style="opacity:0.7; text-transform:uppercase; letter-spacing:0.12em;">Productos</div><strong id="admin-productos">0</strong></div>
      <div class="stat"><div style="opacity:0.7; text-transform:uppercase; letter-spacing:0.12em;">Clientes</div><strong id="admin-clientes">0</strong></div>
      <div class="stat"><div style="opacity:0.7; text-transform:uppercase; letter-spacing:0.12em;">Órdenes</div><strong id="admin-ordenes">0</strong></div>
    </div>

    <div class="card">
      <h4>Últimas órdenes</h4>
      <table>
        <thead>
          <tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th></tr>
        </thead>
        <tbody id="admin-ordenes-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h4>Agregar o editar producto</h4>
      <form id="producto-form">
        <input type="hidden" id="producto-id" />
        <input type="text" id="producto-nombre" placeholder="Nombre del producto" required />
        <input type="number" id="producto-precio" placeholder="Precio" min="0" required />
        <input type="number" id="producto-stock" placeholder="Stock" min="0" required />
        <button type="submit">Guardar producto</button>
      </form>
    </div>

    <div class="card">
      <h4>Productos disponibles</h4>
      <table>
        <thead>
          <tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
        </thead>
        <tbody id="admin-productos-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    let productos = [];

    async function cargarDatos() {
      try {
        const [productosRes, clientesRes, ordenesRes] = await Promise.all([
          fetch('/api/productos'),
          fetch('/api/clientes'),
          fetch('/api/ordenes')
        ]);

        productos = await productosRes.json();
        const clientes = await clientesRes.json();
        const ordenes = await ordenesRes.json();

        document.getElementById('admin-productos').textContent = productos.length;
        document.getElementById('admin-clientes').textContent = clientes.length;
        document.getElementById('admin-ordenes').textContent = ordenes.length;

        const bodyOrdenes = document.getElementById('admin-ordenes-body');
        bodyOrdenes.innerHTML = '';
        ordenes.slice(0, 8).forEach(orden => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>#${orden.id}</td><td>${orden.clienteId || 'Sin cliente'}</td><td>$${Number(orden.total || 0).toLocaleString('es-AR')}</td><td>${orden.estado || 'Pendiente'}</td>`;
          bodyOrdenes.appendChild(tr);
        });

        renderProductos();
      } catch (error) {
        console.error(error);
      }
    }

    function renderProductos() {
      const bodyProductos = document.getElementById('admin-productos-body');
      bodyProductos.innerHTML = '';
      productos.forEach(producto => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${producto.nombre}</td>
          <td>$${Number(producto.precio || 0).toLocaleString('es-AR')}</td>
          <td>${producto.stock}</td>
          <td>
            <button class="btn-small" onclick="editarProducto(${producto.id})">Editar</button>
            <button class="btn-small" onclick="eliminarProducto(${producto.id})">Borrar</button>
          </td>`;
        bodyProductos.appendChild(tr);
      });
    }

    function editarProducto(id) {
      const producto = productos.find(p => p.id === id);
      if (!producto) return;
      document.getElementById('producto-id').value = producto.id;
      document.getElementById('producto-nombre').value = producto.nombre;
      document.getElementById('producto-precio').value = producto.precio;
      document.getElementById('producto-stock').value = producto.stock;
    }

    async function eliminarProducto(id) {
      if (!confirm('¿Seguro que querés borrar este producto?')) return;
      const res = await fetch(`/api/productos/${id}`, { method: 'DELETE' });
      if (res.ok) {
        await cargarDatos();
        alert('Producto borrado');
      } else {
        alert('No se pudo borrar');
      }
    }

    document.getElementById('producto-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = document.getElementById('producto-id').value;
      const payload = {
        nombre: document.getElementById('producto-nombre').value,
        precio: Number(document.getElementById('producto-precio').value),
        stock: Number(document.getElementById('producto-stock').value)
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/productos/${id}` : '/api/productos';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById('producto-form').reset();
        await cargarDatos();
        alert(id ? 'Producto actualizado' : 'Producto creado');
      } else {
        alert('No se pudo guardar el producto');
      }
    });

    document.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
</body>
</html>
